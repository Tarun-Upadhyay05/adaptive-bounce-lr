# Peak learning rate 0.15, decayed to eta_min by linear and by the ABLR
# hybrid. Momentum stays 0.9: raising it enlarges the stationary bounce,
# which is the floor these schedules are meant to get under. Constant at
# 0.15 is the higher-floor control. Cosine at the same peak separates
# schedule shape from the higher start.
name: envelope
notes: >
  Twenty-epoch comparison at peak learning rate 0.15. Linear decay is the
  envelope. ABLR hybrid may only cut below that envelope. Momentum is 0.9.
seeds: [0, 1, 2]
split_seed: 42
epochs: 20
batch_size: 128
num_workers: 0
val_fraction: 0.1
data_dir: data
results_dir: results
figures_dir: figures
device: auto
deterministic: true
amp: true
max_train_batches: null
max_eval_batches: null
accuracy_thresholds: [0.7, 0.8, 0.85]
schedulers:
  - constant
  - cosine
  - linear
  - ablr_hybrid

model:
  num_classes: 10

optimizer:
  lr: 0.15
  momentum: 0.9
  weight_decay: 0.0005

step:
  milestone_fractions: [0.5, 0.75]
  gamma: 0.1

cosine:
  eta_min: 0.00001

linear:
  eta_min: 0.00001

plateau:
  factor: 0.1
  patience: 4
  threshold: 0.01
  threshold_mode: rel
  min_lr: 0.000001

ablr:
  ema_alpha: 0.2
  velocity_window: 4
  reference_beta: 0.1
  healthy_ratio: 0.4
  slow_ratio: 0.1
  slow_patience: 2
  stagnant_patience: 3
  healthy_patience: 3
  slow_factor: 0.5
  stagnant_factor: 0.1
  recover_factor: 1.1
  recover_margin: 0.02
  min_lr: 0.00001
  max_lr: 0.15
  warmup_epochs: 3
  cooldown_epochs: 2
  max_recoveries: 1
  min_reference_velocity: 0.0001
