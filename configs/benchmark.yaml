# Laptop benchmark. Twenty epochs and three seeds fit an RTX 4060 laptop
# budget. Step and cosine schedules are scaled to this budget so each baseline
# can change its learning rate during the run. This is not a 200-epoch
# CIFAR-10 bake-off.
name: benchmark
notes: >
  Short multi-seed comparison on CIFAR-10 ResNet-18. Interpret differences
  inside this budget only.
seeds: [0, 1, 2]
split_seed: 42
epochs: 20
batch_size: 128
num_workers: 0
val_fraction: 0.1
data_dir: data
results_dir: results
figures_dir: figures
device: auto
deterministic: true
amp: true
max_train_batches: null
max_eval_batches: null
accuracy_thresholds: [0.7, 0.8, 0.85]
schedulers:
  - constant
  - step
  - cosine
  - plateau
  - ablr
  - ablr_recovery

model:
  num_classes: 10

optimizer:
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005

step:
  milestone_fractions: [0.5, 0.75]
  gamma: 0.1

cosine:
  eta_min: 0.00001

linear:
  eta_min: 0.00001

plateau:
  factor: 0.1
  patience: 4
  threshold: 0.01
  threshold_mode: rel
  min_lr: 0.000001

ablr:
  ema_alpha: 0.2
  velocity_window: 4
  reference_beta: 0.1
  healthy_ratio: 0.4
  slow_ratio: 0.1
  slow_patience: 2
  stagnant_patience: 3
  healthy_patience: 3
  slow_factor: 0.5
  stagnant_factor: 0.1
  recover_factor: 1.1
  recover_margin: 0.02
  min_lr: 0.00001
  max_lr: 0.1
  warmup_epochs: 3
  cooldown_epochs: 2
  max_recoveries: 1
  min_reference_velocity: 0.0001
