# Quick pipeline check. Three epochs are enough to prove that data, training,
# checkpoints, and every scheduler path run. They are not a performance study.
name: quick
notes: >
  Development run used to validate the pipeline. Do not treat these numbers
  as evidence that one scheduler is better than another.
seeds: [0]
split_seed: 42
epochs: 3
batch_size: 128
num_workers: 0
val_fraction: 0.1
data_dir: data
results_dir: results
figures_dir: figures
device: auto
deterministic: true
amp: true
max_train_batches: null
max_eval_batches: null
accuracy_thresholds: [0.4, 0.6, 0.8]
schedulers:
  - constant
  - step
  - cosine
  - plateau
  - ablr
  - ablr_recovery
  - linear
  - ablr_hybrid

model:
  num_classes: 10

optimizer:
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005

step:
  milestone_fractions: [0.5, 0.75]
  gamma: 0.1

cosine:
  eta_min: 0.00001

linear:
  eta_min: 0.00001

plateau:
  factor: 0.1
  patience: 1
  threshold: 0.01
  threshold_mode: rel
  min_lr: 0.000001

ablr:
  ema_alpha: 0.2
  velocity_window: 1
  reference_beta: 0.1
  healthy_ratio: 0.4
  slow_ratio: 0.1
  slow_patience: 2
  stagnant_patience: 2
  healthy_patience: 2
  slow_factor: 0.5
  stagnant_factor: 0.1
  recover_factor: 1.1
  recover_margin: 0.02
  min_lr: 0.00001
  max_lr: 0.1
  warmup_epochs: 1
  cooldown_epochs: 1
  max_recoveries: 1
  min_reference_velocity: 0.0001
